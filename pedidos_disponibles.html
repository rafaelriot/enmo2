<!DOCTYPE html>
<html class="light" lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "tertiary-container": "#ff591f",
                        "surface-container": "#eeeef0",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#3e4a3c",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2f3133",
                        "surface-bright": "#f9f9fc",
                        "on-error": "#ffffff",
                        "background": "#f9f9fc",
                        "surface-tint": "#006e25",
                        "surface": "#f9f9fc",
                        "on-tertiary-fixed-variant": "#852400",
                        "primary-fixed": "#83fc8e",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#541300",
                        "secondary-container": "#feb700",
                        "on-background": "#1a1c1e",
                        "error-container": "#ffdad6",
                        "primary-container": "#28a745",
                        "outline-variant": "#bdcab9",
                        "surface-container-high": "#e8e8ea",
                        "on-primary-fixed": "#002106",
                        "primary-fixed-dim": "#66df75",
                        "tertiary-fixed": "#ffdbd0",
                        "on-secondary-fixed": "#271900",
                        "outline": "#6e7b6b",
                        "on-surface": "#1a1c1e",
                        "inverse-primary": "#66df75",
                        "on-secondary-container": "#6b4b00",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-container-low": "#f3f3f6",
                        "tertiary-fixed-dim": "#ffb59e",
                        "surface-container-highest": "#e2e2e5",
                        "secondary": "#7c5800",
                        "on-primary-container": "#00330d",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#ffdea8",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#00531a",
                        "on-secondary-fixed-variant": "#5e4200",
                        "tertiary": "#ae3200",
                        "secondary-fixed-dim": "#ffba20",
                        "on-tertiary-fixed": "#3a0b00",
                        "primary": "#006e25",
                        "surface-dim": "#dadadc",
                        "surface-variant": "#e2e2e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "48px",
                        "sm": "12px",
                        "md": "24px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "title-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-bold": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                        "label-bold": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .speed-line-accent {
            border-left: 4px solid;
            border-image: linear-gradient(to bottom, #006e25, #feb700, #ff591f) 1;
        }
    </style>
</head>
<body class="bg-background text-on-surface pb-32">
<!-- Navigation Drawer / Sidebar -->
<div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 z-[9998] hidden opacity-0 transition-opacity duration-300"></div>
<aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-surface-container-lowest border-r border-surface-container-highest z-[9999] -translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-6 shadow-2xl">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-2">
      <h3 class="font-display-lg text-headline-lg-mobile font-black tracking-tighter text-primary">enMo2</h3>
    </div>
    <button id="btn-close-sidebar" class="p-2 rounded-full hover:bg-surface-container transition-colors">
      <span class="material-symbols-outlined text-on-surface-variant">close</span>
    </button>
  </div>
  
  <!-- User Profile Info in Sidebar -->
  <div class="flex items-center gap-3 p-4 bg-surface-container rounded-xl mb-6">
    <div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-black text-lg" id="sidebar-user-avatar">?</div>
    <div class="min-w-0 flex-grow">
      <h4 class="font-title-md text-sm text-on-surface font-bold truncate" id="sidebar-user-name">Repartidor</h4>
      <p class="text-xs text-on-surface-variant truncate" id="sidebar-user-email">email@enmo2.com</p>
    </div>
  </div>

  <nav class="flex-grow space-y-2">
    <a class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-container/10 hover:text-primary text-on-surface-variant transition-colors font-label-bold" href="dashboard_repartidor.html">
      <span class="material-symbols-outlined">home</span>
      <span>Inicio</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary-container/10 text-primary transition-colors font-label-bold" href="pedidos_disponibles.html">
      <span class="material-symbols-outlined">local_mall</span>
      <span>Pedidos Disponibles</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-primary-container/10 hover:text-primary text-on-surface-variant transition-colors font-label-bold" href="perfil_del_repartidor.html">
      <span class="material-symbols-outlined">person</span>
      <span>Mi Perfil</span>
    </a>
  </nav>

  <div class="pt-6 border-t border-surface-container">
    <button id="btn-logout" class="w-full py-3 rounded-xl bg-error-container text-on-error-container font-label-bold text-sm hover:shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
      <span class="material-symbols-outlined">logout</span>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>

<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b-2 border-surface-container-highest h-16">
  <div class="flex justify-between items-center px-margin-mobile h-full w-full max-w-screen-xl mx-auto">
    <div class="flex items-center gap-sm">
      <button class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150" id="btn-menu">
        <span class="material-symbols-outlined text-primary">menu</span>
      </button>
      <img alt="enMo2 Logo" class="h-8 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDY1YdwQ3gOVBr6Rlmed7xFrfbH6dFckNd0uIDxuZssapBiRBLfHxDvdfo_JHXZ5AuRHgLq3ELRV3UC9-rk_9DDbZCTOehcw18H6jAGnitd8WCROUsXFf8_7TzNeSHfP5_acKju6f7jEtqWbcVgb5b9WE0PHNPS4lo765ch69MD5s1b3hR-rGUsJ68gKBp74J8j7NmzGDZ2kkO9mthNgiq_bfkvUnHnekzJzWMEu_gveZ9hTVXvxYcmVdoI6D9SP-xXYhB1J12TserB"/>
    </div>
    <div class="flex items-center gap-2">
      <button class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150" onclick="cargarPedidosDisponibles()">
        <span class="material-symbols-outlined text-primary">sync</span>
      </button>
    </div>
  </div>
</header>

<main class="mt-20 px-margin-mobile max-w-lg mx-auto">
  <section class="mb-6">
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background font-black flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-3xl">local_mall</span>
      Pedidos Disponibles
    </h1>
    <p class="text-xs text-on-surface-variant mt-1">Toma un servicio libre de la bolsa para comenzar tu entrega.</p>
  </section>

  <!-- Pool of Available Orders -->
  <section class="space-y-4" id="available-orders-container">
    <p class="text-center text-on-surface-variant font-label-sm py-8">Buscando servicios disponibles...</p>
  </section>
</main>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t-2 border-surface-container-highest shadow-lg z-50 rounded-t-xl">
  <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="dashboard_repartidor.html">
    <span class="material-symbols-outlined">home</span>
    <span class="font-label-sm text-[10px] font-bold">Inicio</span>
  </a>
  <a class="flex flex-col items-center justify-center bg-primary-container/10 text-primary rounded-full px-5 py-2 transition-transform active:scale-90" href="#">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_mall</span>
    <span class="font-label-sm text-[10px] font-bold">Disponibles</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="pedido_en_curso.html">
    <span class="material-symbols-outlined">map</span>
    <span class="font-label-sm text-[10px] font-bold">Mapa</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-colors" href="perfil_del_repartidor.html">
    <span class="material-symbols-outlined">person</span>
    <span class="font-label-sm text-[10px] font-bold">Mi Perfil</span>
  </a>
</nav>

<!-- Toast Container -->
<div id="toast-container" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-[9999]"></div>

<!-- JavaScript Logic -->
<script>
    // 1. Verificar sesión y rol de repartidor
    const usuarioStr = localStorage.getItem('usuario');
    if (!usuarioStr) {
        window.location.href = 'inicio_de_sesion.html';
    }
    const usuario = JSON.parse(usuarioStr);
    if (usuario.rol !== 'repartidor') {
        if (usuario.rol === 'administrador') {
            window.location.href = 'dashboard_principal.html';
        } else {
            window.location.href = 'inicio_cliente.html';
        }
    }

    document.getElementById('sidebar-user-name').textContent = usuario.nombre;
    document.getElementById('sidebar-user-email').textContent = usuario.email;

    // Colocar iniciales en el avatar
    const inicialesAvatar = usuario.nombre.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();
    const avatarEl = document.getElementById('sidebar-user-avatar');
    if (avatarEl) {
        avatarEl.textContent = inicialesAvatar;
    }

    // Control del menú lateral
    const btnMenu = document.getElementById('btn-menu');
    const btnCloseSidebar = document.getElementById('btn-close-sidebar');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');

    function toggleSidebar(show) {
        if (show) {
            sidebarBackdrop.classList.remove('hidden');
            setTimeout(() => {
                sidebarBackdrop.classList.remove('opacity-0');
                sidebar.classList.remove('-translate-x-full');
            }, 10);
        } else {
            sidebar.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('opacity-0');
            setTimeout(() => {
                sidebarBackdrop.classList.add('hidden');
            }, 300);
        }
    }

    btnMenu.addEventListener('click', () => toggleSidebar(true));
    btnCloseSidebar.addEventListener('click', () => toggleSidebar(false));
    sidebarBackdrop.addEventListener('click', () => toggleSidebar(false));

    // Cerrar sesión
    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('usuario');
        window.location.href = 'inicio_de_sesion.html';
    });

    // Mostrar Toast flotante
    function mostrarToast(mensaje, esExito = true) {
        const antiguo = document.getElementById('status-toast');
        if (antiguo) antiguo.remove();

        const toast = document.createElement('div');
        toast.id = 'status-toast';
        toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-white font-label-bold text-xs shadow-2xl z-[99999] transition-all duration-300 ${esExito ? 'bg-primary' : 'bg-error'}`;
        toast.textContent = mensaje;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // Cargar Pedidos sin repartidor (pendiente)
    async function cargarPedidosDisponibles() {
        const container = document.getElementById('available-orders-container');
        container.innerHTML = '<p class="text-center text-on-surface-variant font-label-sm py-8">Buscando servicios disponibles...</p>';

        try {
            const response = await fetch('api/pedidos');
            const result = await response.json();

            if (response.ok && result.status === 'success') {
                // Filtrar solo pedidos pendientes sin repartidor asignado
                const pendientes = result.data.filter(p => p.estado === 'pendiente' && !p.repartidor_id);
                renderizarDisponibles(pendientes);
            } else {
                container.innerHTML = `<p class="text-center text-error font-label-sm py-8">${result.message || 'Error al obtener pedidos.'}</p>`;
            }
        } catch (error) {
            console.error("Error cargando pedidos disponibles:", error);
            container.innerHTML = '<p class="text-center text-error font-label-sm py-8">Error de conexión al servidor.</p>';
        }
    }

    // Renderizar tarjetas de pedidos disponibles
    function renderizarDisponibles(pedidos) {
        const container = document.getElementById('available-orders-container');
        if (pedidos.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center py-12 px-4 gap-3 bg-surface-container-low rounded-2xl border border-surface-container-high/50">
                    <span class="material-symbols-outlined text-4xl text-outline-variant">explore_off</span>
                    <p class="font-label-bold text-on-surface-variant text-sm">No hay pedidos disponibles por ahora</p>
                    <p class="text-xs text-outline max-w-xs">Todos los servicios se encuentran en curso o ya han sido entregados.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = '';
        pedidos.forEach(pedido => {
            const date = new Date(pedido.created_at);
            const timeStr = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;

            // Separar recogida y entrega
            const partesDireccion = pedido.direccion_entrega.split(' -> ');
            const recogidaDir = partesDireccion[0] || 'Recogida';
            const entregaDir = partesDireccion[1] || pedido.direccion_entrega;

            const cardHtml = `
                <div class="bg-surface-container-lowest rounded-2xl p-5 shadow-sm border border-surface-container flex flex-col gap-4 speed-line-accent">
                    <!-- Cabecera de la Orden -->
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-label-bold text-base text-on-surface font-black">Orden #${pedido.id}</p>
                            <p class="text-[10px] text-outline font-bold uppercase tracking-wider mt-0.5">Registrado a las ${timeStr}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-primary font-bold uppercase tracking-widest">Ganancia estimada</p>
                            <p class="font-display-lg text-xl text-primary font-black">+$${parseFloat(pedido.precio).toFixed(2)}</p>
                        </div>
                    </div>

                    <!-- Ruta (Origen -> Destino) -->
                    <div class="flex flex-col gap-2 bg-surface-container-low/40 p-3 rounded-xl border border-surface-container/30 relative">
                        <!-- Línea vertical punteada -->
                        <div class="absolute left-[21px] top-[26px] bottom-[26px] w-[2px] border-l border-dashed border-primary/40"></div>
                        
                        <div class="flex items-start gap-3 relative z-10">
                            <span class="material-symbols-outlined text-primary text-[18px] bg-primary-container/10 p-0.5 rounded-full flex-shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
                            <div class="min-w-0">
                                <p class="text-[10px] text-outline font-bold uppercase tracking-wider">Recoger en (Origen)</p>
                                <p class="text-xs text-on-surface truncate">${recogidaDir}</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-3 relative z-10">
                            <span class="material-symbols-outlined text-secondary text-[18px] bg-secondary-container/10 p-0.5 rounded-full flex-shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">location_on</span>
                            <div class="min-w-0">
                                <p class="text-[10px] text-outline font-bold uppercase tracking-wider">Entregar en (Destino)</p>
                                <p class="text-xs text-on-surface truncate">${entregaDir}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Botón para Autoasignar -->
                    <button onclick="aceptarPedido(${pedido.id}, this)" class="w-full py-3.5 rounded-xl bg-primary text-on-primary font-label-bold text-sm hover:shadow-lg active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-sm font-bold">check</span>
                        <span>Aceptar Pedido</span>
                    </button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    // Autoasignación de Pedido
    async function aceptarPedido(pedidoId, btn) {
        // Deshabilitar botón durante la transacción
        btn.disabled = true;
        btn.innerHTML = `<span>Asignando...</span><span class="material-symbols-outlined animate-spin text-sm">sync</span>`;

        try {
            const response = await fetch('api/pedidos/actualizar-estado', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pedido_id: pedidoId,
                    estado: 'asignado',
                    repartidor_id: usuario.id
                })
            });

            const res = await response.json();
            if (response.ok && res.status === 'success') {
                mostrarToast("¡Pedido asignado! Redirigiendo...", true);
                setTimeout(() => {
                    window.location.href = `pedido_en_curso.html?id=${pedidoId}`;
                }, 1000);
            } else {
                mostrarToast("Error: " + (res.message || "No se pudo reclamar el pedido."), false);
                btn.disabled = false;
                btn.innerHTML = `<span class="material-symbols-outlined text-sm font-bold">check</span><span>Aceptar Pedido</span>`;
            }
        } catch (error) {
            console.error("Error al asignar pedido:", error);
            mostrarToast("Error de conexión al servidor.", false);
            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-outlined text-sm font-bold">check</span><span>Aceptar Pedido</span>`;
        }
    }

    // Inicializar
    document.addEventListener('DOMContentLoaded', cargarPedidosDisponibles);
</script>
</body>
</html>
