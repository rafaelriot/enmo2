<script src="app.js"></script>
<script>
        let repartidoresPendientes = [];
        let candidatoSeleccionado = null;

        const docTitles = {
            ine: 'Identificación (INE)',
            licencia: 'Licencia de Conducir',
            seguro: 'Seguro de Moto'
        };

        // Cambiar pestañas
        function switchTab(tab) {
            const solView = document.getElementById('view-solicitudes');
            const flotaView = document.getElementById('view-flota');
            const solBtn = document.getElementById('tab-solicitudes');
            const flotaBtn = document.getElementById('tab-flota');

            if (tab === 'solicitudes') {
                solView.classList.remove('hidden');
                flotaView.classList.add('hidden');
                solBtn.classList.add('text-primary', 'border-primary');
                solBtn.classList.remove('text-on-surface-variant');
                flotaBtn.classList.remove('text-primary', 'border-primary');
                flotaBtn.classList.add('text-on-surface-variant');
                cargarCandidatosPendientes();
            } else {
                solView.classList.add('hidden');
                flotaView.classList.remove('hidden');
                flotaBtn.classList.add('text-primary', 'border-primary');
                flotaBtn.classList.remove('text-on-surface-variant');
                solBtn.classList.remove('text-primary', 'border-primary');
                solBtn.classList.add('text-on-surface-variant');
            }
        }

        // Cargar candidatos pendientes desde la API
        async function cargarCandidatosPendientes() {
            const container = document.getElementById('candidates-container');

            try {
                const response = await fetch('api/admin/repartidores-pendientes', {
                    headers: getAuthHeaders()
                });
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    repartidoresPendientes = result.data;
                    renderizarListaCandidatos();
                } else {
                    container.innerHTML = `<p class="text-error text-sm py-4">${result.message || 'Error al cargar candidatos.'}</p>`;
                }
            } catch (error) {
                console.error("Error al cargar candidatos pendientes:", error);
                container.innerHTML = `<p class="text-error text-sm py-4">Error de conexión al cargar candidatos.</p>`;
            }
        }

        function renderizarListaCandidatos() {
            const container = document.getElementById('candidates-container');

            if (!repartidoresPendientes || repartidoresPendientes.length === 0) {
                container.innerHTML = `<p class="text-on-surface-variant text-sm py-4">No hay candidatos con documentos pendientes.</p>`;
                document.getElementById('candidate-detail').classList.add('hidden');
                document.getElementById('candidate-empty').classList.remove('hidden');
                return;
            }

            container.innerHTML = '';
            repartidoresPendientes.forEach((rep, index) => {
                const isSelected = candidatoSeleccionado && candidatoSeleccionado.id === rep.id;
                const card = document.createElement('div');
                card.className = `cursor-pointer bg-surface-container-lowest p-gutter rounded-xl shadow-sm hover:shadow-md transition-all border-l-4 ${isSelected ? 'border-primary speed-line-green' : 'border-transparent opacity-70 hover:opacity-100'} snappy-transition`;
                card.onclick = () => selectCandidate(rep.id);

                const fecha = new Date(rep.fecha_registro).toLocaleDateString('es-MX');

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-label-bold text-label-bold">${rep.nombre}</p>
                            <p class="text-label-sm text-on-surface-variant">${rep.email} • ${fecha}</p>
                        </div>
                        <span class="bg-secondary-container text-on-secondary-container px-2 py-1 rounded-full text-[10px] font-bold">${rep.docs_pendientes} PENDIENTE(S)</span>
                    </div>
                `;
                container.appendChild(card);
            });

            // Seleccionar automáticamente el primero si no hay ninguno seleccionado
            if (!candidatoSeleccionado && repartidoresPendientes.length > 0) {
                selectCandidate(repartidoresPendientes[0].id);
            }
        }

        function selectCandidate(id) {
            candidatoSeleccionado = repartidoresPendientes.find(r => r.id === id);
            if (!candidatoSeleccionado) return;

            // Actualizar vista de lista
            renderizarListaCandidatos();

            document.getElementById('candidate-empty').classList.add('hidden');
            const detailView = document.getElementById('candidate-detail');
            detailView.classList.remove('hidden');

            // Avatar de iniciales
            const iniciales = candidatoSeleccionado.nombre.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('detail-avatar').textContent = iniciales;

            document.getElementById('detail-name').textContent = candidatoSeleccionado.nombre;
            document.getElementById('detail-info').textContent = `Teléfono: ${candidatoSeleccionado.telefono} • Email: ${candidatoSeleccionado.email}`;

            // Renderizar documentos
            const docsContainer = document.getElementById('detail-docs-container');
            docsContainer.innerHTML = '';

            candidatoSeleccionado.documentos.forEach(doc => {
                const title = docTitles[doc.tipo_documento] || doc.tipo_documento.toUpperCase();
                let statusBadge = '<span class="material-symbols-outlined text-secondary-container">warning</span>';
                let isPdf = doc.nombre_archivo.toLowerCase().endsWith('.pdf');

                let statusText = '';
                if (doc.estado === 'aprobado') {
                    statusBadge = '<span class="material-symbols-outlined text-primary">check_circle</span>';
                    statusText = '<span class="text-primary text-xs font-bold">Aprobado</span>';
                } else if (doc.estado === 'rechazado') {
                    statusBadge = '<span class="material-symbols-outlined text-error">cancel</span>';
                    statusText = `<span class="text-error text-xs font-bold">Rechazado: ${doc.motivo_rechazo || ''}</span>`;
                }

                const cardHtml = `
                    <div class="bg-surface-container-lowest p-gutter rounded-xl border border-outline-variant flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-label-bold text-sm">${title}</span>
                                ${statusBadge}
                            </div>
                            <div class="aspect-video bg-surface-variant rounded-lg mb-gutter overflow-hidden relative flex items-center justify-center">
                                ${isPdf ? 
                                    `<div class="flex flex-col items-center p-4 text-center">
                                        <span class="material-symbols-outlined text-primary text-4xl">picture_as_pdf</span>
                                        <a href="api/usuarios/documentos/archivo/${doc.id}" target="_blank" class="text-xs text-primary font-bold hover:underline mt-1">Ver PDF</a>
                                    </div>` : 
                                    `<img class="w-full h-full object-cover cursor-pointer" src="api/usuarios/documentos/archivo/${doc.id}" onclick="window.open('api/usuarios/documentos/archivo/${doc.id}', '_blank')"/>`
                                }
                            </div>
                            <div class="mb-2 text-right">${statusText}</div>
                        </div>
                        ${doc.estado === 'pendiente' ? `
                            <div class="flex gap-2">
                                <button onclick="revisarDocumento(${doc.id}, 'rechazar')" class="flex-1 border border-error text-error py-1.5 rounded font-label-sm hover:bg-error-container snappy-transition">Rechazar</button>
                                <button onclick="revisarDocumento(${doc.id}, 'aprobar')" class="flex-1 bg-primary-container text-on-primary-container py-1.5 rounded font-label-sm hover:opacity-90 snappy-transition">Aprobar</button>
                            </div>
                        ` : ''}
                    </div>
                `;
                docsContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        async function revisarDocumento(docId, accion) {
            let motivo = null;
            if (accion === 'rechazar') {
                motivo = prompt("Ingresa el motivo de rechazo del documento:");
                if (!motivo) return; // Cancelado
            }

            const adminUser = JSON.parse(localStorage.getItem('usuario') || '{}');

            try {
                const response = await fetch('api/admin/documentos/revisar', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        documento_id: docId,
                        accion: accion,
                        motivo_rechazo: motivo,
                        admin_id: adminUser.id || null
                    })
                });
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    alert(`Documento ${accion === 'aprobar' ? 'aprobado' : 'rechazado'} correctamente.`);
                    candidatoSeleccionado = null;
                    cargarCandidatosPendientes();
                } else {
                    alert("Error: " + (result.message || "No se pudo actualizar el documento."));
                }
            } catch (error) {
                console.error("Error revisando documento:", error);
                alert("Error de conexión al revisar el documento.");
            }
        }

        // ─── LÓGICA DE FLOTA COMPLETA EN TIEMPO REAL ───
        let flotaCompleta = [];
        let filtroFlotaActual = 'todos';

        async function cargarFlotaRepartidores() {
            const container = document.getElementById('flota-container');
            container.innerHTML = '<p class="text-on-surface-variant text-sm py-8 text-center col-span-full">Cargando flota de repartidores...</p>';

            try {
                const response = await fetch('api/admin/repartidores-flota', {
                    headers: getAuthHeaders()
                });
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    flotaCompleta = result.data;
                    renderizarFlota();
                } else {
                    container.innerHTML = `<p class="text-error text-sm py-8 text-center col-span-full">${result.message || 'Error al obtener flota.'}</p>`;
                }
            } catch (err) {
                console.error("Error al cargar flota:", err);
                container.innerHTML = '<p class="text-error text-sm py-8 text-center col-span-full">Error de conexión al cargar la flota.</p>';
            }
        }

        function filtrarFlota(tipo) {
            filtroFlotaActual = tipo;
            ['todos', 'online', 'desconectado'].forEach(t => {
                const btn = document.getElementById(`btn-flota-${t}`);
                if (!btn) return;
                if (t === tipo) {
                    btn.className = 'flex-1 md:flex-none px-6 py-2 bg-primary text-on-primary rounded-lg font-label-bold';
                } else {
                    btn.className = 'flex-1 md:flex-none px-6 py-2 bg-surface-container-highest text-on-surface-variant rounded-lg font-label-bold hover:bg-surface-variant transition-all';
                }
            });
            renderizarFlota();
        }

        function renderizarFlota() {
            const container = document.getElementById('flota-container');
            const searchInput = document.getElementById('input-buscar-flota');
            const busqueda = searchInput ? searchInput.value.toLowerCase().trim() : '';

            let filtrados = flotaCompleta.filter(r => {
                const matchTexto = r.nombre.toLowerCase().includes(busqueda) || 
                                   (r.email && r.email.toLowerCase().includes(busqueda)) || 
                                   (r.telefono && r.telefono.includes(busqueda));

                if (!matchTexto) return false;

                if (filtroFlotaActual === 'online') {
                    return r.is_online;
                } else if (filtroFlotaActual === 'desconectado') {
                    return !r.is_online;
                }
                return true; // todos
            });

            if (filtrados.length === 0) {
                container.innerHTML = '<p class="text-on-surface-variant text-sm py-8 text-center col-span-full">No se encontraron repartidores con los criterios especificados.</p>';
                return;
            }

            container.innerHTML = '';
            filtrados.forEach(r => {
                let badgeColor = 'bg-outline/20 text-outline';
                let badgeText = 'DESCONECTADO';
                let borderSpeed = 'border-outline-variant';
                let subText = 'Sin señal GPS reciente';

                if (r.estado_cuenta !== 'activo') {
                    badgeColor = 'bg-error-container text-on-error-container';
                    badgeText = 'SUSPENDIDO / INACTIVO';
                    borderSpeed = 'border-error';
                    subText = 'Cuenta inhabilitada';
                } else if (r.is_online) {
                    if (r.ocupado) {
                        badgeColor = 'bg-amber-500/20 text-amber-600 font-black';
                        badgeText = 'EN RUTA (OCUPADO)';
                        borderSpeed = 'border-amber-500 speed-line-yellow';
                        subText = 'Realizando pedido activo';
                    } else {
                        badgeColor = 'bg-emerald-500/20 text-emerald-600 font-black';
                        badgeText = 'EN LÍNEA (DISPONIBLE)';
                        borderSpeed = 'border-emerald-500 speed-line-green';
                        subText = 'Aparece en Mapa de Operaciones';
                    }
                }

                const iniciales = r.nombre ? r.nombre.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase() : 'RP';

                const avatarHtml = r.foto_url ? 
                    `<img class="w-full h-full object-cover" src="${r.foto_url}" />` :
                    `<div class="w-full h-full bg-primary-container text-on-primary-container font-black text-sm flex items-center justify-center">${iniciales}</div>`;

                const cardHtml = `
                    <div class="bg-surface-container-lowest rounded-xl p-gutter shadow-sm border-l-4 ${borderSpeed} hover:shadow-md transition-all flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-sm">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 border border-surface-container-high">
                                        ${avatarHtml}
                                    </div>
                                    <div>
                                        <p class="font-label-bold text-on-surface">${r.nombre}</p>
                                        <p class="text-label-sm text-on-surface-variant">${r.telefono || 'Sin tel.'}</p>
                                    </div>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <span class="inline-block px-2 py-1 ${badgeColor} rounded text-[9px] uppercase tracking-wider">${badgeText}</span>
                                    <p class="text-[10px] text-on-surface-variant mt-1 font-bold">${r.total_viajes || 0} viajes realizados</p>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3 pt-3 border-t border-surface-container-high flex justify-between items-center text-[10px] font-label-bold uppercase text-on-surface-variant">
                            <span class="truncate">${subText}</span>
                            <span class="text-primary font-bold">ID: #${r.id}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Listener para búsqueda en tiempo real en la flota
        document.getElementById('input-buscar-flota')?.addEventListener('input', renderizarFlota);

        // Cargar candidatos al inicio y flota
        document.addEventListener('DOMContentLoaded', () => {
            cargarCandidatosPendientes();
            cargarFlotaRepartidores();
        });
    </script>
</body></html>
