<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>enMo2 - Historial de Pedidos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="tailwind-config.js"></script>
    <script src="app.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen pb-32">
<script>
// Guard: Solo administradores
(function() {
    const u = localStorage.getItem('usuario');
    if (!u) { window.location.href = 'inicio_de_sesion.html'; return; }
    const usr = JSON.parse(u);
    if (usr.rol === 'repartidor') { window.location.href = 'dashboard_repartidor.html'; return; }
    if (usr.rol === 'cliente') { window.location.href = 'inicio_cliente.html'; return; }
})();
</script>
    <!-- Top Bar -->
    <header class="fixed top-0 w-full z-50 bg-surface border-b-2 border-surface-container-highest h-16 flex justify-between items-center px-margin-mobile max-w-screen-xl mx-auto">
        <div class="flex items-center gap-xs">
            <button onclick="window.history.back()" class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
                <span class="material-symbols-outlined text-primary">arrow_back</span>
            </button>
            <h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Historial</h1>
        </div>
        <button onclick="toggleDarkMode()" class="material-symbols-outlined text-primary p-2 rounded-lg hover:bg-surface-container-low transition-colors active:scale-95 duration-150">dark_mode</button>
    </header>

    <main class="mt-20 px-margin-mobile max-w-screen-xl mx-auto space-y-md">
        <!-- Filtros Card -->
        <div class="bg-surface-container-lowest p-md rounded-2xl border border-surface-container shadow-sm space-y-sm">
            <h2 class="font-title-md text-title-md text-on-surface flex items-center gap-xs">
                <span class="material-symbols-outlined text-primary">filter_alt</span>
                Filtros de búsqueda
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-sm">
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-label-bold text-on-surface-variant opacity-70">Fecha Inicio</label>
                    <input id="filtro-fecha-inicio" type="date" class="w-full bg-surface border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-primary focus:border-primary"/>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-label-bold text-on-surface-variant opacity-70">Fecha Fin</label>
                    <input id="filtro-fecha-fin" type="date" class="w-full bg-surface border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-primary focus:border-primary"/>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-label-bold text-on-surface-variant opacity-70">Estado</label>
                    <select id="filtro-estado" class="w-full bg-surface border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-primary focus:border-primary">
                        <option value="todos">Todos los estados</option>
                        <option value="pendiente">Sin Asignar (Pendiente)</option>
                        <option value="asignado">Asignados</option>
                        <option value="en_ruta">En Ruta</option>
                        <option value="entregado">Entregados</option>
                        <option value="cancelado">Cancelados</option>
                    </select>
                </div>
                <div class="flex items-end gap-2">
                    <button onclick="buscarHistorial()" class="flex-1 bg-primary text-on-primary font-label-bold py-2.5 rounded-xl hover:shadow active:scale-95 transition-all flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-sm">search</span>
                        <span>Buscar</span>
                    </button>
                    <button onclick="exportarCSV()" class="p-2.5 bg-secondary-container text-on-secondary-container rounded-xl hover:shadow active:scale-95 transition-all" title="Exportar CSV">
                        <span class="material-symbols-outlined text-sm">download</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabla/Listado de Historial -->
        <div class="bg-surface-container-lowest rounded-2xl border border-surface-container shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-surface-container-low border-b border-surface-container text-xs font-label-bold text-on-surface-variant uppercase">
                            <th class="p-4">Orden</th>
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Dirección</th>
                            <th class="p-4">Repartidor</th>
                            <th class="p-4">Precio</th>
                            <th class="p-4">Estado</th>
                            <th class="p-4">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="historial-table-body" class="text-sm">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-outline italic">Utiliza los filtros de arriba para buscar pedidos.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let pedidosCargados = [];

        async function buscarHistorial() {
            const user = checkAuth();
            if (!user) return;

            const tableBody = document.getElementById('historial-table-body');
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="p-8 text-center">
                        <div class="animate-pulse flex flex-col gap-2 items-center justify-center">
                            <div class="h-4 bg-surface-container-high rounded w-48"></div>
                            <div class="h-3 bg-surface-container-high rounded w-32"></div>
                        </div>
                    </td>
                </tr>
            `;

            const fInicio = document.getElementById('filtro-fecha-inicio').value;
            const fFin = document.getElementById('filtro-fecha-fin').value;
            const fEstado = document.getElementById('filtro-estado').value;

            try {
                const url = `api/admin/historial?fecha_inicio=${fInicio}&fecha_fin=${fFin}&estado=${fEstado}`;
                const response = await fetch(url, {
                    headers: getAuthHeaders()
                });
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    pedidosCargados = result.data;
                    renderHistorial();
                } else {
                    mostrarToast(result.message || 'Error al cargar el historial.', false);
                }
            } catch (err) {
                console.error(err);
                mostrarToast('Error de conexión con el servidor.', false);
            }
        }

        function renderHistorial() {
            const tableBody = document.getElementById('historial-table-body');
            tableBody.innerHTML = '';

            if (pedidosCargados.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-8 text-center text-outline italic">No se encontraron registros.</td>
                    </tr>
                `;
                return;
            }

            pedidosCargados.forEach(p => {
                let badgeClass = 'bg-surface-container-highest text-outline';
                if (p.estado === 'entregado') badgeClass = 'bg-primary-container text-on-primary-container';
                if (p.estado === 'pendiente') badgeClass = 'bg-error-container text-on-error-container';
                if (p.estado === 'en_ruta') badgeClass = 'bg-tertiary-container text-on-tertiary-container';
                
                const tr = document.createElement('tr');
                tr.className = 'border-b border-surface-container hover:bg-surface-container-low transition-colors';
                tr.innerHTML = `
                    <td class="p-4 font-label-bold">#${p.id}</td>
                    <td class="p-4">${p.cliente_nombre}</td>
                    <td class="p-4 truncate max-w-xs">${p.direccion_entrega}</td>
                    <td class="p-4">${p.repartidor_nombre || '<span class="text-outline italic">Sin asignar</span>'}</td>
                    <td class="p-4 font-label-bold">$${parseFloat(p.price || p.precio).toFixed(2)}</td>
                    <td class="p-4"><span class="px-2.5 py-0.5 rounded text-[10px] font-black uppercase ${badgeClass}">${p.estado}</span></td>
                    <td class="p-4 text-xs text-outline">${new Date(p.created_at).toLocaleDateString()}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function exportarCSV() {
            if (pedidosCargados.length === 0) {
                mostrarToast('No hay datos cargados para exportar.', false);
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID Orden,Cliente,Direccion,Repartidor,Precio,Estado,Fecha\n";

            pedidosCargados.forEach(p => {
                const row = [
                    p.id,
                    `"${p.cliente_nombre.replace(/"/g, '""')}"`,
                    `"${p.direccion_entrega.replace(/"/g, '""')}"`,
                    `"${(p.repartidor_nombre || '').replace(/"/g, '""')}"`,
                    parseFloat(p.price || p.precio).toFixed(2),
                    p.estado,
                    p.created_at
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `historial_pedidos_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Carga inicial
        window.addEventListener('DOMContentLoaded', () => {
            // Poner fecha fin hoy por defecto
            document.getElementById('filtro-fecha-fin').value = new Date().toISOString().slice(0, 10);
            buscarHistorial();
        });
    </script>
</body>
</html>
