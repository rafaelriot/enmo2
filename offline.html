<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>enMo2 - Sin Conexión</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="tailwind-config.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-md space-y-md">
        <!-- Icono de Red desconectada -->
        <div class="w-24 h-24 bg-primary/10 rounded-2xl flex items-center justify-center text-primary mx-auto animate-pulse">
            <span class="material-symbols-outlined text-5xl">wifi_off</span>
        </div>

        <div class="space-y-xs">
            <h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">Sin conexión a Internet</h1>
            <p class="font-body-md text-on-surface-variant">
                Actualmente no tienes una conexión activa a internet. enMo2 intentará reestablecer el canal en cuanto la red vuelva a estar disponible.
            </p>
        </div>

        <!-- Botón de reintento -->
        <button onclick="window.location.reload()" class="w-full bg-primary text-on-primary font-label-bold py-3.5 rounded-xl hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
            <span class="material-symbols-outlined">sync</span>
            <span>Reintentar conexión</span>
        </button>
    </div>
</body>
</html>
